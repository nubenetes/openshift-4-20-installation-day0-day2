apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-service-canary
  namespace: payments-prod
spec:
  parentRefs:
    - name: enterprise-gateway
      namespace: openshift-ingress
      sectionName: https-wildcard
  hostnames:
    - "payments.apps.corp.local"
  rules:
    # Rule 1: Tester header override to Canary v2
    - matches:
        - headers:
            - name: X-Canary-Test
              value: enabled
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v2
      backendRefs:
        - name: payments-v2
          port: 8080
          weight: 100
    # Rule 2: Production traffic split: 90% v1, 10% v2
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: payments-v1
          port: 8080
          weight: 90
        - name: payments-v2
          port: 8080
          weight: 10
