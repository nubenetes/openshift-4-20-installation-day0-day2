apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: enterprise-gateway
  namespace: openshift-ingress
  annotations:
    cert-manager.io/cluster-issuer: vault-issuer
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-wildcard
      protocol: HTTPS
      port: 443
      hostname: "*.apps.corp.local"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: enterprise-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: tls-passthrough
      protocol: TLS
      port: 8443
      hostname: "*.vms.corp.local"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All
