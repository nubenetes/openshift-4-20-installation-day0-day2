apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: prod-db-rhel9-vm
  namespace: production-vms
  labels:
    app: database
    os: rhel9
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/domain: prod-db-rhel9-vm
    spec:
      domain:
        cpu:
          cores: 8
          sockets: 1
          threads: 1
        memory:
          guest: 32Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        features:
          acpi: {}
          apic: {}
          smm:
            enabled: true
        firmware:
          bootloader:
            efi:
              secureBoot: true
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: prod-db-rhel9-root-pvc
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              fqdn: db01.corp.local
              users:
                - name: cloud-admin
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGitOpsManagedKey admin@corp.local
