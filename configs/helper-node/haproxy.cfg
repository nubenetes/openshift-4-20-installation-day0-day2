# /etc/haproxy/haproxy.cfg for OpenShift 4.20 Helper Node
global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     20000
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/lib/haproxy/stats

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    retries                 3
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout check           10s
    maxconn                 10000

# Statistics Web Dashboard
listen stats
    mode http
    bind *:9000
    stats enable
    stats uri /stats
    stats refresh 5s

# OpenShift API (Port 6443)
frontend ocp_api
    bind *:6443
    default_backend ocp_api_be

backend ocp_api_be
    balance source
    # Temporary bootstrap backend (remove after bootstrap complete)
    server bootstrap 192.168.10.99:6443 check
    server master-0  192.168.10.11:6443 check
    server master-1  192.168.10.12:6443 check
    server master-2  192.168.10.13:6443 check

# Machine Config Server (Port 22623)
frontend ocp_mc
    bind *:22623
    default_backend ocp_mc_be

backend ocp_mc_be
    balance source
    server bootstrap 192.168.10.99:22623 check
    server master-0  192.168.10.11:22623 check
    server master-1  192.168.10.12:22623 check
    server master-2  192.168.10.13:22623 check

# OpenShift Ingress HTTP (Port 80)
frontend ocp_http
    bind *:80
    default_backend ocp_http_be

backend ocp_http_be
    balance roundrobin
    server worker-0 192.168.10.21:80 check
    server worker-1 192.168.10.22:80 check
    server worker-2 192.168.10.23:80 check

# OpenShift Ingress HTTPS (Port 443)
frontend ocp_https
    bind *:443
    default_backend ocp_https_be

backend ocp_https_be
    balance roundrobin
    server worker-0 192.168.10.21:443 check
    server worker-1 192.168.10.22:443 check
    server worker-2 192.168.10.23:443 check
