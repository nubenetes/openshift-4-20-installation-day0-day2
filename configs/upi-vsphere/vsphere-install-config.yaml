apiVersion: v1
baseDomain: corp.local
metadata:
  name: ocp-vsphere-prod
controlPlane:
  name: master
  replicas: 3
  platform:
    vsphere:
      cpus: 8
      coresPerSocket: 4
      memoryMB: 32768
      osDisk:
        diskSizeGB: 120
compute:
  - name: worker
    replicas: 3
    platform:
      vsphere:
        cpus: 16
        coresPerSocket: 4
        memoryMB: 65536
        osDisk:
          diskSizeGB: 200
networking:
  networkType: OVNKubernetes
  machineNetwork:
    - cidr: 10.200.10.0/24
platform:
  vsphere:
    vCenter: vcenter.corp.local
    username: openshift-installer@vsphere.local
    password: "SecretVcenterPassword123!"
    datacenter: DC-Production
    defaultDatastore: vsanDatastore-01
    network: DPortGroup-OCP-VLAN200
    cluster: Compute-Cluster-01
    apiVIPs:
      - 10.200.10.100
    ingressVIPs:
      - 10.200.10.101
pullSecret: '{"auths":{"YOUR_PULL_SECRET_HERE":{"auth":"..."}}}'
sshKey: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... admin@example.com'
