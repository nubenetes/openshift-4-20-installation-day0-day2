apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-canary-route
  namespace: payments-prod
spec:
  parentRefs:
    - name: payments-waypoint
      kind: Gateway
      group: gateway.networking.k8s.io
  hostnames:
    - "payments.payments-prod.svc.cluster.local"
    - "payments.apps.ocp4.corp.local"
  rules:
    # Rule 1: Tester header routes 100% to canary v2
    - matches:
        - headers:
            - type: Exact
              name: X-Canary-Tester
              value: "enabled"
      backendRefs:
        - name: payments-v2
          port: 8080
    # Rule 2: Production traffic split 90% v1 / 10% v2
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/checkout
      backendRefs:
        - name: payments-v1
          port: 8080
          weight: 90
        - name: payments-v2
          port: 8080
          weight: 10
