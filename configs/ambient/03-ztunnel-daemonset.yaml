apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ztunnel
  namespace: istio-system
  labels:
    app: ztunnel
    istio.io/dataplane-mode: ambient
spec:
  selector:
    matchLabels:
      app: ztunnel
  template:
    metadata:
      labels:
        app: ztunnel
      annotations:
        sidecar.istio.io/inject: "false"
        prometheus.io/scrape: "true"
        prometheus.io/port: "15020"
        prometheus.io/path: "/stats/prometheus"
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      priorityClassName: system-node-critical
      serviceAccountName: ztunnel
      terminationGracePeriodSeconds: 30
      containers:
        - name: istio-proxy
          image: registry.redhat.io/openshift-service-mesh/ztunnel-rhel9:3.0.0
          args:
            - proxy
            - ztunnel
          env:
            - name: CLUSTER_ID
              value: Kubernetes
            - name: INSTANCE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CA_ADDRESS
              value: istiod.istio-system.svc:15012
            - name: XDS_ADDRESS
              value: istiod.istio-system.svc:15012
            - name: TERMINATION_DRAIN_DURATION_SECONDS
              value: "5"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          ports:
            - containerPort: 15008
              name: hbone
              protocol: TCP
            - containerPort: 15020
              name: ztunnel-stats
              protocol: TCP
            - containerPort: 15021
              name: healthz
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: varrunztunnel
              mountPath: /var/run/ztunnel
      volumes:
        - name: varrunztunnel
          hostPath:
            path: /var/run/ztunnel
