apiVersion: v1
baseDomain: cloud.example.com
metadata:
  name: ocp-aws-prod
publish: Internal
credentialsMode: Manual
controlPlane:
  name: master
  replicas: 3
  platform:
    aws:
      type: m6i.xlarge
      zones:
        - eu-west-1a
        - eu-west-1b
        - eu-west-1c
compute:
  - name: worker
    replicas: 3
    platform:
      aws:
        type: m6i.2xlarge
        zones:
          - eu-west-1a
          - eu-west-1b
          - eu-west-1c
networking:
  networkType: OVNKubernetes
  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23
  serviceNetwork:
    - 172.30.0.0/16
  machineNetwork:
    - cidr: 10.0.0.0/16
platform:
  aws:
    region: eu-west-1
    subnets:
      - subnet-0a1b2c3d4e5f6g7h8
      - subnet-1a2b3c4d5e6f7g8h9
      - subnet-2a3b4c5d6e7f8g9h0
pullSecret: '{"auths":{"YOUR_PULL_SECRET_HERE":{"auth":"..."}}}'
sshKey: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAI... admin@example.com'
