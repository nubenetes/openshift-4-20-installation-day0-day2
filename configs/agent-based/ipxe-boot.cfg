#!ipxe
# ==============================================================================
# OpenShift 4.20 Agent-Based Installer (ABI) iPXE Boot Script
# Used when booting nodes over PXE/TFTP/HTTP without Virtual Media / Redfish.
# Artifacts generated via: openshift-install agent create pxe-files --dir=.
# ==============================================================================

# Helper Node HTTP web server base path hosting PXE artifacts
set base-url http://10.50.10.1:8080/agent-pxe

# Kernel arguments for live boot and rootfs retrieval
set kernel-args ip=dhcp rd.neednet=1 coreos.live.rootfs_url=${base-url}/agent.rootfs.x86_64.img console=tty0 console=ttyS0,115200n8

prompt --key 0x02 --timeout 3000 Press Ctrl-B for the iPXE command line... || goto boot_agent

:boot_agent
echo ======================================================================
echo Booting OpenShift 4.20 Agent-Based Installer via iPXE...
echo Base URL: ${base-url}
echo ======================================================================

echo Loading Agent Live Linux Kernel...
kernel ${base-url}/agent.vmlinuz.x86_64 ${kernel-args} || goto failed

echo Loading Agent Live Initramfs...
initrd ${base-url}/agent.initramfs.x86_64.img || goto failed

echo Booting kernel...
boot || goto failed

:failed
echo [ERROR] iPXE Boot Failed! Dropping to interactive shell...
shell
