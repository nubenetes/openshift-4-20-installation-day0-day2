apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: default
  namespace: openshift-ingress-operator
spec:
  replicas: 3
  nodePlacement:
    nodeSelector:
      matchLabels:
        node-role.kubernetes.io/infra: ""
    tolerations:
      - key: node-role.kubernetes.io/infra
        operator: Exists
        effect: NoSchedule
  defaultCertificate:
    name: wildcard-apps-tls-cert
  tuningOptions:
    maxConnections: 50000
    clientTimeout: 60s
    clientFinTimeout: 10s
    serverTimeout: 60s
    serverFinTimeout: 10s
    tunnelTimeout: 1h
